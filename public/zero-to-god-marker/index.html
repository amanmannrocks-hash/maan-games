<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0c10"><title>Zero to God Hitpoint Marker</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0c10;color:#f5f1e8;font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:5;padding:12px;background:#13151bcc;border-bottom:1px solid #ffffff1c;backdrop-filter:blur(12px)}h1{font-size:18px;margin:0 0 8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,.file{border:1px solid #ffffff24;background:#20232b;color:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.gold{background:#e4b95f;color:#23180a;border:0}.danger{color:#ff8c86}.file input{display:none}main{max-width:900px;margin:auto;padding:12px}.status{display:flex;justify-content:space-between;margin-bottom:8px}.stage{position:relative;width:100%;background:#15171d;border:1px solid #ffffff20;border-radius:12px;overflow:hidden}.stage img{display:block;width:100%;height:auto}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#d9b968;background:#000b}.panel{margin-top:10px;padding:12px;border:1px solid #ffffff1c;border-radius:12px;background:#15171d}.modes button.on{border-color:#e4b95f;color:#e4b95f}.name{flex:1;min-width:150px;background:#090a0d;color:#fff;border:1px solid #ffffff24;border-radius:8px;padding:10px}.objects{display:grid;gap:6px;margin-top:10px}.obj{display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:center;padding:7px;background:#0c0d11;border-radius:8px}.n{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#ff3b30;font-weight:900}.obj input{width:100%;background:transparent;border:0;color:#fff}.small{font-size:11px;color:#aaa}.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:10px}.dot{padding:5px 8px}.dot.on{border-color:#e4b95f;color:#e4b95f}.dot.done{color:#72d99a}.note{color:#aaa;font-size:12px;line-height:1.4}@media(min-width:760px){main{display:grid;grid-template-columns:1fr 300px;gap:12px}.side{align-self:start;position:sticky;top:90px}.panel{margin-top:0;margin-bottom:10px}}</style></head><body><header><h1>Zero to God — Hitpoint Marker</h1><div class="row"><label class="file">Choose 10 images<input id="files" type="file" accept="image/*" multiple></label><button id="export" class="gold">Export JSON</button><button id="copy">Copy JSON</button></div></header><main><section><div class="status"><b id="levelText">Level 1 of 10</b><b id="count">0 / 4</b></div><div class="stage"><img id="img"><canvas id="cv"></canvas><div id="empty" class="empty">Tap “Choose 10 images”, then select level images named 1 through 10 together.</div></div><div class="row" style="justify-content:space-between;margin-top:10px"><button id="prev">← Previous</button><button id="next">Next →</button></div><div id="dots" class="dots"></div></section><aside class="side"><section class="panel"><div class="row"><input id="name" class="name" placeholder="Object name (optional)"><div class="modes row"><button id="circle" class="on">Circle</button><button id="square">Square</button></div></div><div class="row" style="margin-top:9px"><button id="undo">Undo</button><button id="reset" class="danger">Reset level</button></div><p class="note">Drag around each object. After the fourth selection, the next level opens automatically. Images and progress stay saved in this browser.</p></section><section class="panel"><b>Selected objects</b><div id="objects" class="objects"></div></section></aside></main><script>'use strict';const N=10,MAX=4,SK='z2g-marker-mobile-v1',DB='z2g-marker-images-v1',ST='images',$=x=>document.getElementById(x),E={files:$('files'),img:$('img'),cv:$('cv'),empty:$('empty'),level:$('levelText'),count:$('count'),dots:$('dots'),objects:$('objects'),name:$('name'),circle:$('circle'),square:$('square'),prev:$('prev'),next:$('next'),undo:$('undo'),reset:$('reset'),export:$('export'),copy:$('copy')},C=E.cv.getContext('2d');let S=load(),L=Math.max(0,Math.min(9,S.level||0)),mode=S.mode==='square'?'square':'circle',drag=null,url=null;function fresh(){return{level:0,mode:'circle',levels:Array.from({length:N},(_,i)=>({level:i+1,imageWidth:1024,imageHeight:1536,objects:[]}))}}function load(){try{let x=JSON.parse(localStorage.getItem(SK));return x&&x.levels?.length===N?x:fresh()}catch{return fresh()}}function save(){S.level=L;S.mode=mode;localStorage.setItem(SK,JSON.stringify(S))}function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function get(n){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(ST),r=t.objectStore(ST).get(n);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error);t.oncomplete=()=>d.close()})}async function put(fs){let a=[...fs].sort((x,y)=>num(x.name)-num(y.name)),ns=a.map(x=>num(x.name));if(a.length!==10||ns.some(Number.isNaN)||new Set(ns).size!==10||Math.min(...ns)!==1||Math.max(...ns)!==10)throw Error('Select exactly 10 files named 1.png through 10.png.');let d=await db();await new Promise((ok,no)=>{let t=d.transaction(ST,'readwrite'),s=t.objectStore(ST);s.clear();a.forEach(f=>s.put(f,num(f.name)));t.oncomplete=ok;t.onerror=()=>no(t.error)});d.close()}function num(s){let m=String(s).match(/(?:^|\D)(10|[1-9])(?:\D|$)/);return m?+m[1]:NaN}function cur(){return S.levels[L]}async function show(i){L=Math.max(0,Math.min(9,i));if(url)URL.revokeObjectURL(url);let b=await get(L+1).catch(()=>null);if(!b){E.empty.hidden=false;E.img.removeAttribute('src');render();return}url=URL.createObjectURL(b);E.img.src=url;E.empty.hidden=true;E.name.value='';render();save()}E.img.onload=()=>{let q=cur();q.imageWidth=E.img.naturalWidth||1024;q.imageHeight=E.img.naturalHeight||1536;E.cv.width=q.imageWidth;E.cv.height=q.imageHeight;paint();save()};function render(){let a=cur().objects;E.level.textContent=`Level ${L+1} of ${N}`;E.count.textContent=`${a.length} / ${MAX}`;E.prev.disabled=L===0;E.next.disabled=L===9;E.undo.disabled=E.reset.disabled=!a.length;E.circle.classList.toggle('on',mode==='circle');E.square.classList.toggle('on',mode==='square');E.dots.innerHTML='';S.levels.forEach((v,i)=>{let b=document.createElement('button');b.className='dot'+(i===L?' on':'')+(v.objects.length===4?' done':'');b.textContent=v.objects.length===4?'✓':i+1;b.onclick=()=>show(i);E.dots.append(b)});E.objects.innerHTML='';a.forEach((o,i)=>{let d=document.createElement('div');d.className='obj';d.innerHTML=`<span class="n">${i+1}</span><div><input maxlength="60"><div class="small"></div></div><button class="danger">×</button>`;let inp=d.querySelector('input');inp.value=o.name;inp.oninput=()=>{o.name=inp.value;save()};d.querySelector('.small').textContent=o.shape==='circle'?`x ${r(o.center.x)}, y ${r(o.center.y)}, radius ${r(o.radius)}`:`x ${r(o.center.x)}, y ${r(o.center.y)}, size ${r(o.size)}`;d.querySelector('button').onclick=()=>{a.splice(i,1);save();render();paint()};E.objects.append(d)})}function r(v){return Math.round(v*100)/100}function point(ev){let b=E.cv.getBoundingClientRect();return{x:(ev.clientX-b.left)*E.cv.width/b.width,y:(ev.clientY-b.top)*E.cv.height/b.height}}E.cv.onpointerdown=ev=>{if(cur().objects.length>=4||!E.img.src)return;E.cv.setPointerCapture(ev.pointerId);let p=point(ev);drag={a:p,b:p};paint()};E.cv.onpointermove=ev=>{if(!drag)return;drag.b=point(ev);paint()};function end(ev){if(!drag)return;drag.b=point(ev);let dx=drag.b.x-drag.a.x,dy=drag.b.y-drag.a.y,w=cur().imageWidth,h=cur().imageHeight,o,n=cur().objects.length+1;if(mode==='circle'){let rr=Math.max(8,Math.hypot(dx,dy));o={id:`object_${n}`,name:E.name.value.trim()||`Object ${n}`,shape:'circle',center:{x:r(drag.a.x),y:r(drag.a.y)},radius:r(rr)}}else{let size=Math.max(16,Math.max(Math.abs(dx),Math.abs(dy))),cx=drag.a.x+Math.sign(dx||1)*size/2,cy=drag.a.y+Math.sign(dy||1)*size/2;o={id:`object_${n}`,name:E.name.value.trim()||`Object ${n}`,shape:'square',center:{x:r(cx),y:r(cy)},size:r(size)}}cur().objects.push(o);drag=null;E.name.value='';save();render();paint();if(cur().objects.length===4&&L<9)setTimeout(()=>show(L+1),350)}E.cv.onpointerup=end;E.cv.onpointercancel=()=>{drag=null;paint()};function draw(o,preview=false){C.save();C.strokeStyle='#ff3b30';C.fillStyle=preview?'#ff3b3020':'#ff3b3028';C.lineWidth=Math.max(3,E.cv.width/300);C.setLineDash(preview?[12,8]:[]);C.beginPath();if(o.shape==='circle')C.arc(o.center.x,o.center.y,o.radius,0,Math.PI*2);else C.rect(o.center.x-o.size/2,o.center.y-o.size/2,o.size,o.size);C.fill();C.stroke();C.restore()}function paint(){C.clearRect(0,0,E.cv.width,E.cv.height);cur().objects.forEach(draw);if(drag){let dx=drag.b.x-drag.a.x,dy=drag.b.y-drag.a.y;if(mode==='circle')draw({shape:'circle',center:drag.a,radius:Math.max(8,Math.hypot(dx,dy))},true);else{let s=Math.max(16,Math.max(Math.abs(dx),Math.abs(dy)));draw({shape:'square',center:{x:drag.a.x+Math.sign(dx||1)*s/2,y:drag.a.y+Math.sign(dy||1)*s/2},size:s},true)}}}function payload(){return{project:'Zero to God',coordinateSystem:'original-image-pixels',generatedAt:new Date().toISOString(),levels:S.levels.map(v=>({...v,objects:v.objects.map(o=>{let w=v.imageWidth,h=v.imageHeight,b=o.shape==='circle'?{x:r(o.center.x-o.radius),y:r(o.center.y-o.radius),width:r(o.radius*2),height:r(o.radius*2)}:{x:r(o.center.x-o.size/2),y:r(o.center.y-o.size/2),width:r(o.size),height:r(o.size)};return{...o,hitPoint:{...o.center},bounds:b,normalized:{center:{x:+(o.center.x/w).toFixed(6),y:+(o.center.y/h).toFixed(6)},bounds:{x:+(b.x/w).toFixed(6),y:+(b.y/h).toFixed(6),width:+(b.width/w).toFixed(6),height:+(b.height/h).toFixed(6)}}}}) }))}}E.files.onchange=async()=>{try{await put(E.files.files);await show(0)}catch(x){alert(x.message)}};E.circle.onclick=()=>{mode='circle';save();render()};E.square.onclick=()=>{mode='square';save();render()};E.prev.onclick=()=>show(L-1);E.next.onclick=()=>show(L+1);E.undo.onclick=()=>{cur().objects.pop();save();render();paint()};E.reset.onclick=()=>{if(confirm('Remove all four selections from this level?')){cur().objects=[];save();render();paint()}};E.export.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='zero-to-god-hitpoints.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};E.copy.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(payload(),null,2));alert('JSON copied')};show(L);</script></body></html>
